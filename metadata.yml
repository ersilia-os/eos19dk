Status: Ready
Title: MolCompass Chemical Space Projection
Description: Places a molecule on a two-dimensional map of chemical space with MolCompass,
  a parametric t-SNE network trained in advance on 1,564,049 ChEMBL v23 structures
  encoded as 2048-bit ECFP fingerprints of radius 3. Because the mapping is learned
  and fixed, projection is a single forward pass and the same structure always lands
  in the same place, which ordinary t-SNE cannot guarantee. The map was built for
  inspecting the applicability domain of QSAR models and for spotting model cliffs;
  it describes relative position in ChEMBL-like chemistry and predicts no property.
