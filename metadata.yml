Status: Ready
Title: MolCompass Chemical Space Projection
Description: Places a molecule on a two-dimensional map of chemical space using MolCompass,
  a parametric t-SNE network trained in advance so that projection is a single forward
  pass rather than a refitting of the whole embedding. Because the mapping is learned
  and fixed, the same molecule always lands in the same position and structurally
  similar compounds cluster together, which conventional t-SNE cannot guarantee. Coordinates
  describe relative position in the reference space and carry no property prediction.
