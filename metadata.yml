Slug: molcompass
Status: In progress
Title: MolCompass Chemical Space Projection
Description: 'Projects any molecule, given as a SMILES string, onto a 2D map of chemical
  space using a pre-trained parametric t-SNE neural network. The projection is deterministic:
  structurally similar compounds consistently cluster together, based on 2048-bit
  ECFP fingerprints (radius=3) and a network trained on 1.56 million ChEMBL v.23 structures.
  Useful for exploring chemical space, checking a QSAR/QSPR models applicability domain,
  and spotting model cliffs where structurally similar compounds get inconsistent
  predictions.'
